<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- smoltask: a ruled line with a ticked box on a Monokai ground. The tick
       overhangs the box the way a pen does when you are not being careful. -->
  <rect width="32" height="32" rx="7" fill="#272822"/>
  <rect x="5" y="7" width="13" height="13" rx="3" fill="none" stroke="#75715E" stroke-width="2"/>
  <path d="M8 13.5 L11.5 17.5 L20 5.5" fill="none" stroke="#A6E22E"
        stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="5" y="24" width="22" height="2.5" rx="1.25" fill="#49483E"/>
</svg>
