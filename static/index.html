<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>smoltask</title>
<link rel="icon" href="/static/favicon.png" sizes="32x32">
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header>
  <h1>smoltask</h1>
  <nav id="tabs">
    <button data-view="tasks" class="on">Tasks</button>
    <button data-view="archive">Archive</button>
    <button data-view="settings">Settings</button>
  </nav>
  <!-- Notifications live in the header: at the top where the eyes are, but in
       the flow rather than floating over the first line of the page. -->
  <div id="notify">
    <div id="undo" hidden></div>
    <div id="toast" hidden></div>
  </div>
</header>

<main id="view"></main>

<footer id="keys"></footer>

<script src="/static/app.js"></script>
</body>
</html>
