# There is no authentication in front of this. Anything that can reach the
# published port can read and edit every task, which is fine for a single-user
# notebook on a machine you control and would not be fine for anything else.
# See SECURITY.md.
#
# The published port defaults to 8108; set SMOLTASK_PORT to change it. The
# intended deployment is local only:
#
#     ports:
#       - "127.0.0.1:${SMOLTASK_PORT:-8108}:8000"
#
# Drop the address prefix only if you actually want it reachable from the rest
# of your network, and only if you trust that network with your to-do list.
services:
  smoltask:
    build: .
    container_name: smoltask
    ports:
      - "${SMOLTASK_PORT:-8108}:8000"
    # The image's own user is uid 10001, but the SQLite file lives on a bind
    # mount owned by the host user, so run as that user rather than chowning a
    # host directory. Change to match your own uid:gid, or drop the line and
    # chown ./data to 10001 instead.
    user: "1000:1000"
    environment:
      # This matters more here than in most apps. Every "today" question — the
      # day's tick count, due today, stale for a week — is answered against the
      # server's local date, and a container with no TZ runs in UTC. Left unset
      # east of Greenwich, the page is a day behind its owner for half of every
      # day. Set TZ in .env to the timezone of the person using it.
      TZ: ${TZ:-UTC}
    volumes:
      - ./data:/data
    restart: unless-stopped
    healthcheck:
      # /health opens the database, so a container that cannot read or write
      # its volume fails the check rather than reporting green while every
      # write 500s.
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      # Locally built image, not a pulled one — watchtower has nothing to do here.
      com.centurylinklabs.watchtower.enable: 'false'
