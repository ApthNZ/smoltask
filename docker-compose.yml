# There is no authentication in front of this. Anything that can reach the
# published port can read and edit every task, which is fine for a single-user
# notebook on a machine you control and would not be fine for anything else.
# See SECURITY.md.
#
# By default the port is published on 127.0.0.1 only, so the app is reachable
# from this machine and nowhere else. To serve it to the rest of your network,
# set in .env:
#
#     SMOLTASK_BIND=0.0.0.0
#     SMOLTASK_ALLOWED_HOSTS=localhost,127.0.0.1,<the name or address you browse to>
#
# The second line matters as much as the first. The app refuses any request
# whose Host header it was not told about (that is its defence against DNS
# rebinding), so a LAN address that is not listed gets "Invalid host header".
#
# Do not count on a host firewall to narrow a 0.0.0.0 binding: Docker writes
# its own iptables rules for published ports, ahead of ufw's and firewalld's,
# so a port published here is open whatever those say.
#
# The port defaults to 8108; set SMOLTASK_PORT to change it.
services:
  smoltask:
    build: .
    container_name: smoltask
    ports:
      - "${SMOLTASK_BIND:-127.0.0.1}:${SMOLTASK_PORT:-8108}:8000"
    # The image's own user is uid 10001, but the SQLite file lives on a bind
    # mount owned by the host user, so run as that user rather than chowning a
    # host directory. Change to match your own uid:gid, or drop the line and
    # chown ./data to 10001 instead.
    user: "1000:1000"
    # Nothing in the container writes anywhere but /data, and uvicorn needs no
    # Linux capability to listen on 8000, so the root filesystem is read-only,
    # every capability is dropped, and nothing can gain privileges by exec.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      # This matters more here than in most apps. Every "today" question — the
      # day's tick count, due today, stale for a week — is answered against the
      # server's local date, and a container with no TZ runs in UTC. Left unset
      # east of Greenwich, the page is a day behind its owner for half of every
      # day. Set TZ in .env to the timezone of the person using it.
      TZ: ${TZ:-UTC}
      # Blank means the defaults: localhost, 127.0.0.1 and [::1]. See the top.
      SMOLTASK_ALLOWED_HOSTS: ${SMOLTASK_ALLOWED_HOSTS:-}
    volumes:
      - ./data:/data
    restart: unless-stopped
    healthcheck:
      # /health opens the database, so a container that cannot read or write
      # its volume fails the check rather than reporting green while every
      # write 500s.
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      # Locally built image, not a pulled one — watchtower has nothing to do here.
      com.centurylinklabs.watchtower.enable: 'false'
